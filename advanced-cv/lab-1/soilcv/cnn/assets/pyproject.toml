[project]
name = "soilcv-cnn-experiments"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "soilcv[train,tracking]",
    "numpy==2.1.3",
    "pandas==2.3.3",
    "pillow==13.0.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "wandb==0.28.1",
    "matplotlib==3.10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
soilcv = { path = "..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
