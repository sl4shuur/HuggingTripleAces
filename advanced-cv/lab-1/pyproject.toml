[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilcv"
version = "0.1.0"
description = "Shared soil grain-size experiment tools"
readme = "soilcv/README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "Pillow>=10"]

[project.optional-dependencies]
train = ["torch>=2.3"]
tracking = ["wandb>=0.25.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soilcv*"]

[tool.setuptools.package-data]
soilcv = ["assets/*.csv", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
