[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilcv"
version = "0.1.1"
description = "Shared soil grain-size experiment tools"
readme = "soilcv/README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "Pillow>=10"]

[project.optional-dependencies]
train = ["torch>=2.3", "torchvision>=0.18"]
tracking = ["wandb>=0.25.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soilcv*"]

[tool.setuptools.package-data]
soilcv = ["assets/*.csv", "README.md", "cnn/assets/*.toml", "cnn/assets/*.lock"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# These source imports are part of the verified, finished MIL checkpoint identity.
"soilcv/bags.py" = ["I001", "F401"]
"soilcv/cnn/model.py" = ["I001", "F401"]
"soilcv/nn.py" = ["I001", "F401"]
"soilcv/curves.py" = ["I001", "F401"]
