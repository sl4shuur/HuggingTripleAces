[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alseg"
version = "0.1.0"
description = "Shared active-learning segmentation contracts for Assignment 2"
requires-python = ">=3.11"
dependencies = ["torch>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["alseg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
