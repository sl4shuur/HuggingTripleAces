[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alseg"
version = "0.6.3"
description = "Shared active-learning segmentation contracts for Assignment 2"
requires-python = ">=3.11"
dependencies = ["torch>=2.3,<3", "rich-click>=1.8,<2", "numpy>=1.26", "Pillow>=10", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
encoder = ["transformers==5.20.2"]
train = ["lightning==2.6.6", "wandb==0.28.1"]
publish = ["kaggle==2.2.5", "packaging>=24", "six>=1.17,<2"]

[tool.setuptools.packages.find]
include = ["alseg*", "script*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
