[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alseg"
version = "0.4.0"
description = "Shared active-learning segmentation contracts for Assignment 2"
requires-python = ">=3.11"
dependencies = ["torch>=2.3,<3", "rich-click>=1.8,<2", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
encoder = ["transformers==5.20.2"]

[tool.setuptools.packages.find]
include = ["alseg*"]
namespaces = true

[tool.setuptools]
py-modules = ["cli_common", "setup_project"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
