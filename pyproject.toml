[project]
name = "HuggingTripleAces"
version = "0.1.0"
description = "Hugging Triple Aces Team Project for Computer Vision Course at KSE"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "colorama>=0.4.6",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.1",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.1",
    "pytorch-lightning>=2.6.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13",
    "segmentation-models-pytorch>=0.5.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
    "xgboost>=3.2.0",
]


# https://docs.astral.sh/uv/guides/integration/pytorch/#configuring-accelerators-with-environment-markers
[project.optional-dependencies]
cpu = [
  "torch>=2.9.0",
]
gpu = [
  "torch>=2.9.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
